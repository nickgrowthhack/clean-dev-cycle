name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Selecionar GNU no Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu
      - name: Preparar o toolchain fixado
        run: rustup show
      - name: Instalar Jujutsu 0.45.1 verificado
        run: ./.github/scripts/install-jj.ps1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Conferir formatação
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Executar análise estática
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Testar
        run: cargo test --locked
      - name: Validar mensagem e execução da CLI
        run: |
          $binary = if ($IsWindows) { './target/debug/clean-dev-cycle.exe' } else { './target/debug/clean-dev-cycle' }
          ./.github/scripts/check-messages.ps1 -Binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary release check --revision $env:GITHUB_SHA
          exit $LASTEXITCODE

  release:
    name: Release
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: clean-dev-cycle-release
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar o toolchain fixado
        run: rustup show
      - name: Compilar a CLI do commit aprovado
        run: cargo build --locked
      - name: Publicar tag e release do SHA aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/clean-dev-cycle release publish --revision "$GITHUB_SHA"
