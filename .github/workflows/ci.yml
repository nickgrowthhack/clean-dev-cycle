name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Selecionar GNU no Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu
      - name: Preparar o toolchain fixado
        run: rustup show
      - name: Instalar Jujutsu 0.45.1 verificado
        run: ./.github/scripts/install-jj.ps1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Conferir formatação
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Executar análise estática
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Testar
        run: cargo test --locked
      - name: Validar mensagens e release do commit
        run: |
          $binary = if ($IsWindows) { './target/debug/clean-dev-cycle.exe' } else { './target/debug/clean-dev-cycle' }
          ./.github/scripts/check-messages.ps1 -Binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary release check --revision $env:GITHUB_SHA
          exit $LASTEXITCODE

  package:
    name: Binário (${{ matrix.os }})
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Selecionar GNU no Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu
      - name: Preparar o toolchain fixado
        run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Compilar o binário otimizado do commit aprovado
        run: cargo build --release --locked
      - name: Empacotar o binário com checksum
        run: ./.github/scripts/package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binario-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: clean-dev-cycle-release
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar o toolchain fixado
        run: rustup show
      - name: Compilar a CLI do commit aprovado
        run: cargo build --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publicar tag, release e binários do SHA aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | Sort-Object Name | ForEach-Object { '--asset'; $_.FullName }
          ./target/debug/clean-dev-cycle release publish --revision $env:GITHUB_SHA @assets
          exit $LASTEXITCODE
