name: CI

on:
  push:
    branches: [nick/submit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: true

jobs:
  candidate:
    name: Mudança
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.verify.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        name: Conferir uma mudança sobre a main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/nick/submit') { throw 'Envie a mudança para nick/submit.' }
          $base = git rev-parse origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível resolver a base.' }
          ./.github/scripts/check-candidate.ps1 -Base $base -Candidate $env:GITHUB_SHA
          "base=$base" >> $env:GITHUB_OUTPUT

  validate:
    name: Rust (${{ matrix.os }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      BASE: ${{ needs.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Selecionar GNU no Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu
      - name: Preparar o toolchain fixado
        run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Conferir formatação
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Executar análise estática
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Testar
        run: cargo test --locked
      - name: Validar mensagem e execução da CLI
        run: |
          $binary = if ($IsWindows) { './target/debug/clean-dev-cycle.exe' } else { './target/debug/clean-dev-cycle' }
          & $binary check-commit --from $env:BASE --to $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --version
          exit $LASTEXITCODE

  quality:
    name: Qualidade
    needs: [candidate, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Exigir sucesso de todas as verificações
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          VALIDATION: ${{ needs.validate.result }}
        run: test "$CANDIDATE" = success && test "$VALIDATION" = success

  promote:
    name: Integrar na main
    needs: [candidate, quality]
    if: ${{ success() && github.ref == 'refs/heads/nick/submit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Promover exatamente o commit aprovado
        shell: pwsh
        env:
          BASE: ${{ needs.candidate.outputs.base }}
        run: ./.github/scripts/promote.ps1 -Base $env:BASE -Candidate $env:GITHUB_SHA
