[package]
name = "clean-dev-cycle"
# A versão publicada vive em .clean-dev-cycle-release.json e é lida por build.rs.
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "CLI para concluir mudanças com Jujutsu, verificar e publicar na main."
repository = "https://github.com/nickgrowthhack/clean-dev-cycle"
readme = "README.md"
publish = false

[dependencies]
ctrlc = "3.5"
git-conventional = "1.1.0"
next_version = "0.3.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
toml = "1.1"

[build-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
